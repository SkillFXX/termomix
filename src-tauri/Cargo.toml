[package]
name = "termomix"
version = "0.2.0"
description = "Termomix, client SSH moderne"
edition = "2021"

[lib]
name = "termomix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
russh = "0.65"
russh-sftp = "3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
thiserror = "2"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
