name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Termomix ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false

      # Exécutable Windows seul (portable), disponible aussi sans publier de release.
      - name: Exécutable portable Windows
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: termomix-windows-portable
          path: src-tauri/target/release/termomix.exe

      - name: Installeurs
        uses: actions/upload-artifact@v4
        with:
          name: termomix-${{ matrix.name }}-installers
          path: src-tauri/target/release/bundle/**/*
